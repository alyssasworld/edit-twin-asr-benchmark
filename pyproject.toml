[project]
name = "edit-twin-asr-benchmark"
version = "0.1.0"
description = " Python package requirements for eval project for choosing the best ASR model for Edit Twin MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "edit-twin-mcp",
    "jiwer>=4.0.0",
    "mlx-audio==0.6.3",
    "mlx-whisper>=0.4.3",
    "pandas>=3.1.0",
    "parakeet-mlx>=0.5.3",
    "whisper-normalizer>=0.1.15",
]
[tool.pytest.ini_options]
pythonpath = ["."]
# slow tests run a real model; skipped unless asked for with: uv run pytest -m slow
markers = ["slow: runs a real speech model (needs audio and model download)"]
addopts = "-m 'not slow'"

[tool.uv.sources]
edit-twin-mcp = { path = "../edit-twin-mcp", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
